# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

# 리뷰 코멘트를 한국어로 받습니다.
language: 'ko-KR'

# 250자 제한이 있어 짧게 유지합니다.
tone_instructions: '백엔드 경험자로 구성된, 프론트엔드는 처음인 팀입니다. 일반적인 설계 원칙 설명은 생략하고 React/Next.js 고유의 함정을 짚어주세요. PR 제목의 타입([DESIGN]/[FEAT]/[FIX]/[REFACTOR])에 따라 볼 것이 다릅니다. 문서(DESIGN.md·CLAUDE.md·CONTRIBUTING.md)가 이미 정한 규칙과 어긋나는지를 먼저 보고, 문서에 없는 취향은 말하지 마세요.'

reviews:
  # 새 스택을 익히는 중이라 지적이 많은 쪽이 학습에 유리합니다.
  # 코멘트가 부담되면 "chill"로 낮추세요.
  profile: 'assertive'

  # 리뷰가 끝나야 병합할 수 있게 강제하지는 않습니다.
  request_changes_workflow: false

  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  poem: false

  auto_review:
    enabled: true
    # 작업 중인 draft PR은 리뷰하지 않습니다.
    drafts: false
    # 기본 브랜치(develop) 외에 main으로 향하는 PR도 리뷰합니다.
    base_branches:
      - 'main'

  path_filters:
    - '!**/package-lock.json'
    - '!**/.next/**'
    - '!**/node_modules/**'
    - '!**/*.min.js'
    - '!**/public/**'

  path_instructions:
    # ─────────────────────────────────────────────────────────────
    # 0. 모든 변경에 공통 — 이 레포는 규칙이 문서에 있습니다
    # ─────────────────────────────────────────────────────────────
    - path: '**/*.{ts,tsx}'
      instructions: |
        이 저장소는 규칙을 세 문서가 나눠 갖습니다. 리뷰는 취향이 아니라 이 문서와
        어긋나는지를 봅니다. 문서에 없는 규칙을 새로 주장하지 마세요.

        - DESIGN.md — 색·타이포·부품·레이아웃·문구의 값과 그 값을 고른 이유.
          디자인에 관한 모든 판단의 근거는 여기 있습니다.
        - CLAUDE.md — 폴더 구조, 층 사이의 의존 방향, 컨벤션, 빌드.
        - CONTRIBUTING.md — 브랜치·커밋·PR 규칙, 화면이 직접 그리지 않는 것.

        값이 문서와 코드 양쪽에 적히면 한쪽이 먼저 낡습니다. 코드에 박힌 값이
        문서에도 있으면 "문서를 가리키게 하라"고 짚어주세요.

        구조에서 반드시 보는 것:
        - 의존 방향은 app → features → shared 한 방향입니다. shared가 features를
          부르면 순환이고, 그 부품은 그 기능 없이는 못 씁니다.
        - shared/ui는 도메인을 모릅니다. features/** 도 shared/types/api 도
          import하지 않습니다. shared/lib·types·hooks는 도메인 타입을 알아도 됩니다.
        - features끼리 부르는 import가 새로 생기면 짚어주세요.
        - 같은 값이 두 파일에 생기면 짚어주세요. 한 곳으로 모을 수 있는지 물어보세요.

        주석은 "왜"만 남깁니다. 다음 줄이 무슨 일을 하는지 옮겨 적은 주석,
        문법·API 사용법 설명, "여기서 상태가 바뀜" 같은 흐름 중계는 지울 대상입니다.
        반대로 코드만 봐서는 알 수 없는 제약·비직관적 선택의 이유·TODO는 남깁니다.

    # ─────────────────────────────────────────────────────────────
    # 1. [DESIGN] — 기능 변경 없는 UI·스타일
    # ─────────────────────────────────────────────────────────────
    - path: 'src/{features,app,shared}/**/*.tsx'
      instructions: |
        PR이 [DESIGN] 타입이면 아래를 우선해서 봐주세요. 기능 변경이 없어야 하므로,
        동작이 바뀌는 diff가 섞여 있으면 그것부터 짚어주세요.

        값이 규칙 위에 있는가:
        - 색·radius는 globals.css의 @theme 토큰 클래스만 씁니다. bg-[#4dd8ff] 같은
          임의값은 금지입니다.
        - @theme에 없는 이름은 스타일이 "약하게" 적용되는 게 아니라 아무것도
          적용되지 않습니다(--color-*: initial이 프레임워크 팔레트를 지웠습니다).
          bg-white, text-gray-900, bg-secondary-400처럼 토큰에 없는 이름이 보이면
          그 요소는 지금 투명하거나 색이 없는 상태입니다. 반드시 짚어주세요.
        - 타이포는 DESIGN.md §3의 램프만 씁니다. text-[14px] leading-[22px] 같은
          임의값을 새로 만들면 짚어주세요. 굵기는 토큰에 없으니 따로 줍니다.
        - 간격은 DESIGN.md §2의 목록만 씁니다(4의 배수로 24까지, 그 뒤 32·40·48·64·80·96).
          28·36·44·56·72와 6·10·14 같은 값이 새로 생기면 짚어주세요.
          컴포넌트 내부 치수(§5)는 이 목록의 대상이 아닙니다.
        - 토큰이나 램프에 없는 값이 필요해 보이면 "멈추고 협의"가 정답입니다.
          우회해서 임의값을 쓴 흔적이 있으면 그렇게 말해주세요.

        누가 그리는가:
        - 화면은 배치만 합니다. 누르는 것·값을 받는 것·고유한 모양은 shared/ui에서
          가져옵니다. 화면에서 button·input·select·textarea·svg를 직접 쓰면 짚어주세요.
        - 공통 부품에 className이나 style을 넘기면 짚어주세요. 필요한 것은 props로
          만들어 부품 쪽에 반영해야 합니다.
        - 아이콘은 <Icon name="…" />입니다.

        구조를 바꿨으면 남은 것도 보세요:
        - 디자인이나 구조를 바꾸면 그전에 필요했던 클래스가 남습니다. 새로 붙은 것만
          보지 말고, 바뀐 뒤에도 그 클래스가 일을 하는지 물어보세요.
        - 특히 absolute를 쓰는 요소에 relative 부모가 있는지 확인해주세요. 없으면
          기준이 문서 최상위가 되어 스크롤 컨테이너를 탈출합니다.
          Tailwind의 sr-only에는 position: absolute가 들어 있습니다.
        - 전역으로 겹치는 fixed·sticky는 z-숫자가 아니라 globals.css의 이름
          (z-nav·z-modal·z-tooltip 등)을 씁니다.

        cn()의 함정:
        - tailwind-merge는 클래스가 어느 그룹인지 이름으로 판단하는데, globals.css가
          만든 토큰은 그 목록에 없어 엉뚱하게 분류됩니다. 토큰을 늘리거나 바꾸면
          shared/lib/cn.ts의 목록과 scripts/check-cn.mjs도 같이 고쳐야 합니다.
          빠뜨려도 린트·타입·빌드가 전부 통과하고 화면에서만 조용히 틀립니다.

    # ─────────────────────────────────────────────────────────────
    # 2. [FEAT] — 기능 추가
    # ─────────────────────────────────────────────────────────────
    - path: 'src/features/**/*.{ts,tsx}'
      instructions: |
        PR이 [FEAT] 타입이면 "정상 경로가 도는가"보다 "실패하면 어떻게 되는가"를
        우선해서 봐주세요. 이 팀의 코드는 AI 생성 비중이 높아 정상 경로는 동작하지만
        예외 처리가 비어 있는 경우가 많습니다. 구현된 코드의 문제뿐 아니라
        "빠져 있는 처리"를 적극적으로 지적해주세요.

        서버 상태:
        - 모든 서버 통신은 shared/lib의 apiClient를 거칩니다. 컴포넌트에서 직접
          fetch하면 짚어주세요.
        - fetch는 404·500 같은 HTTP 에러에 reject하지 않습니다. 네트워크 실패에만
          throw합니다. response.ok 확인 없이 .json()을 부르는 코드를 반드시 짚어주세요.
        - 응답 형태를 검증 없이 신뢰하는 코드를 짚어주세요. 서버가 계약과 다른 값을
          줄 수 있고, 이 레포는 아직 백엔드 연동 전이라 목이 항상 성공합니다.
          목에서만 도는 가정(항상 데이터가 있다, 항상 빠르다)이 코드에 박혀 있으면
          그렇게 말해주세요.
        - 서버 상태는 TanStack Query로 다룹니다. useState + useEffect로 직접
          만든 캐시·로딩 플래그가 보이면 짚어주세요.
        - 비동기(STT·AI 요약·TODO 생성)는 /status 폴링으로 완료를 감지하며,
          폴링은 공통 훅으로 처리합니다.

        화면의 세 상태:
        - 비동기 데이터를 다루는 화면에 로딩·에러·빈 상태가 모두 있는지 확인해주세요.
          셋 중 하나라도 없으면 지적해주세요.
        - 조건부로만 나타나는 상태(로딩·빈·에러·처리중)는 눈으로 보기 어려워
          스타일이 깨진 채 남기 쉽습니다. 그 분기의 클래스도 같이 봐주세요.
        - 응답이 null·undefined일 때, 배열이 빈 배열일 때 화면이 깨지지 않는지 봐주세요.

        사용자가 기다리는 동안:
        - 요청 중 다시 누르거나 입력을 바꾸는 경우 — 중복 제출 방지(버튼 비활성화)와
          이전 요청 취소(AbortController)가 필요한 곳을 알려주세요.
        - 응답 전에 언마운트되거나, 먼저 보낸 요청이 나중에 도착해 결과가 뒤바뀌는
          경우를 확인해주세요.
        - 인증 토큰 만료·401 처리가 있는지 확인해주세요.
        - try/catch로 감쌌지만 catch가 비어 있거나 console.error만 하고 사용자에게
          아무것도 알리지 않는 코드를 짚어주세요.

        새 기능이 지켜야 할 것:
        - 기능 전용 코드는 features/<기능>/에 둡니다. 공유가 필요하면 shared로 올리되,
          도메인을 아는 부품은 shared/ui에 갈 수 없습니다.
        - 새 API 응답 타입은 shared/types/api.ts에 먼저 정의합니다.
        - 상호작용이 있으면 'use client'를 붙입니다.
        - 문구는 DESIGN.md §6을 따릅니다 — 제품 안은 전부 해요체, 확정·파괴 버튼은
          ~하기로 끝나고, 눌린 동안은 자기 낱말 + 중…, 실패는 ~하지 못했어요입니다.

    # ─────────────────────────────────────────────────────────────
    # 3. [FIX] — 버그 수정
    # ─────────────────────────────────────────────────────────────
    - path: 'src/**/*.{ts,tsx}'
      instructions: |
        PR이 [FIX] 타입이면 "이 diff가 증상을 없애는가"가 아니라 "원인을 고쳤는가"를
        봐주세요. 리포트는 증상의 이름일 뿐입니다.

        - 같은 원인이 다른 호출처에도 있는지 확인해주세요. 공유 함수 안에 가드 하나를
          두는 편이 호출처마다 가드를 두는 것보다 작은 diff이고, 티켓이 말한 경로만
          고치면 형제 호출처는 그대로 깨져 있습니다.
        - 증상이 사라지는 자리와 원인이 있는 자리가 다르면 그렇게 말해주세요.
          렌더 결과를 보정하는 수정(값을 덮어쓰기, 조건 추가)이 실제로는 상위에서
          잘못된 값이 내려오는 문제인 경우가 많습니다.
        - 회귀를 막을 것이 남았는지 물어보세요. 같은 버그가 다시 들어올 때
          무엇이 잡아주는지가 diff에 없으면 그렇게 말해주세요.
        - 그 버그가 왜 생겼는지가 코드에 남아야 합니다. 비직관적인 수정이면
          "왜 이렇게 고쳤는지" 주석이 있는지 봐주세요.
        - 수정 범위 밖의 변경이 섞여 있으면 짚어주세요. [FIX]는 좁을수록 좋습니다.

    # ─────────────────────────────────────────────────────────────
    # 4. [REFACTOR] — 동작 변경 없는 개선
    # ─────────────────────────────────────────────────────────────
    - path: 'src/**/*.{ts,tsx}'
      instructions: |
        PR이 [REFACTOR] 타입이면 가장 중요한 질문은 "동작이 정말 그대로인가"입니다.

        - 동작이 바뀌는 diff가 섞여 있으면 반드시 짚어주세요. 옮기기와 고치기가
          한 커밋에 있으면 리뷰어가 무엇이 이동이고 무엇이 변경인지 구분할 수 없습니다.
        - 구조를 바꾼 뒤 남은 코드는 두 종류입니다. 바뀐 구조에서 할 일이 없어진
          것(지웁니다)과, 바뀐 구조가 성립하려면 없어야 하는 것(지우는 게 변경 자체입니다).
          둘을 같은 "청소"로 묶어 설명하면 diff를 잘못 읽게 됩니다.
        - 추상이 값어치를 하는지 물어보세요. 구현이 하나뿐인 인터페이스, 제품이
          하나뿐인 팩토리, 바뀌지 않는 값을 위한 설정은 만들지 않습니다.
          호출처가 넷인데 탈출구(props)가 셋이면 추상이 아니라 설정입니다.
        - 옮긴 코드가 층 규칙을 깨지 않는지 확인해주세요. shared로 올렸는데
          도메인을 알고 있으면 그 자리가 아닙니다.
        - 지운 것이 정말 안 쓰이는지 확인해주세요.

    # ─────────────────────────────────────────────────────────────
    # 5. Next.js 16 — 학습 데이터와 다릅니다
    # ─────────────────────────────────────────────────────────────
    - path: 'src/app/**/*.{ts,tsx}'
      instructions: |
        이 프로젝트는 Next.js 16 App Router입니다. 15 이하 기준의 조언을 하지 마세요.
        16에서 깨지는 변경이 많습니다 — middleware → proxy 파일명 변경,
        Request API의 async화, next/image 기본값 변경, Turbopack 기본 적용.
        확신이 없으면 그렇게 밝히고, node_modules/next/dist/docs/를 근거로 삼으세요.
        파일명이 틀리면 에러가 아니라 조용히 실행되지 않습니다.

        - page.tsx는 얇게 유지합니다. 로직은 features로 뺍니다.
        - 'use client'가 꼭 필요한 곳에만 있는지, 경계를 트리 아래로 내릴 수 있는지
          확인해주세요.
        - 서버 컴포넌트에서 useState·useEffect 등 클라이언트 전용 훅을 쓰지 않는지
          확인해주세요.
        - 서버에서만 써야 할 값(API 키·시크릿)이 클라이언트 컴포넌트의 props로 넘어가
          번들에 포함되지 않는지 확인해주세요.
        - fetch의 캐시 동작(force-cache·no-store·revalidate)이 의도대로인지,
          명시하지 않아 기본값에 의존하는 곳은 없는지 확인해주세요.
        - 서버 컴포넌트에서 할 수 있는 조회를 useEffect로 가져오면 지적해주세요.
        - 데이터를 가져오는 라우트에 error.tsx와 loading.tsx가 있는지 확인해주세요.
          없으면 에러 시 흰 화면이 뜨거나 페이지가 멈춘 것처럼 보입니다.
        - 동적 라우트에 notFound() 처리가 있는지 확인해주세요.

    # ─────────────────────────────────────────────────────────────
    # 6. React — 타입과 무관하게 늘 보는 것
    # ─────────────────────────────────────────────────────────────
    - path: '**/*.tsx'
      instructions: |
        React 19입니다. ref는 일반 prop이라 forwardRef가 필요 없습니다.

        - 훅 규칙 위반(조건문·반복문 안에서 호출, 의존성 배열 누락)을 짚어주세요.
        - useEffect가 불필요한 경우를 지적해주세요. 렌더링 중 계산할 수 있거나
          이벤트 핸들러에서 처리할 수 있으면 알려주세요.
        - 리스트 key로 배열 인덱스를 쓰면 지적해주세요.
        - 조건부 렌더링에서 && 좌변이 숫자면 0이 그대로 렌더링됩니다.
        - 상태를 불변으로 다루는지 확인해주세요. 기존 객체·배열을 직접 바꾸면
          리렌더링이 일어나지 않습니다.
        - 한글 입력(IME) 조합 중에 Enter가 두 번 발화합니다. 키 핸들러에
          e.nativeEvent.isComposing 가드가 있는지 확인해주세요.
        - 접근성: 글자 없는 컨트롤에 aria-label, 이미지에 alt, 칸에 라벨 연결이
          있는지 봐주세요. 색만으로 상태를 알리면 짚어주세요.
          필수 표시의 별표는 aria-hidden이고, 필수는 칸 자신의 required로 알립니다.
        - Tailwind 클래스를 문자열로 조립하면 빌드 시 감지되지 않아 스타일이
          사라집니다. 동적 클래스 생성을 짚어주세요.

    # ─────────────────────────────────────────────────────────────
    # 7. 문서 — 코드와 같이 낡습니다
    # ─────────────────────────────────────────────────────────────
    - path: '**/*.md'
      instructions: |
        이 저장소는 규칙을 문서가 갖고 코드가 그것을 따릅니다. 문서 변경은
        "무엇이 정해졌는가"와 "왜 그 값인가"가 같이 적혔는지를 봐주세요.

        - 값이 두 문서에 적히면 한쪽이 먼저 낡고, 낡은 쪽이 먼저 읽힙니다.
          CLAUDE.md는 값을 적지 않고 DESIGN.md를 가리킵니다.
        - 규칙을 새로 더할 때 "무엇을 포기했는가"가 없으면 물어보세요.
          이 문서들은 고른 이유와 버린 대안을 같이 적는 형식입니다.
        - 코드가 이미 그 규칙을 어기고 있는지 확인해주세요. 규칙만 들어오고
          코드가 안 따라오면 다음 사람이 어느 쪽을 믿을지 알 수 없습니다.
        - 숫자가 나오면 그 숫자가 어디서 나왔는지 적혀 있는지 봐주세요.
          근거 없이 들어온 값은 이 저장소가 한 번 겪은 실패입니다.

  tools:
    # ESLint가 이 저장소의 규칙 상당수를 이미 강제합니다.
    # 색·타이포 임의값, 날것 button/input/svg, shared/ui의 className,
    # 층 사이의 import 방향이 전부 여기서 막힙니다.
    # 린트가 막은 자리를 우회한 흔적이 있으면 짚어주세요.
    eslint:
      enabled: true

chat:
  auto_reply: true
