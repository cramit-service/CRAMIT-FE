# PR에서 린트와 타입체크를 돌린다.
#
# 이게 없으면 eslint.config.mjs의 규칙은 주석과 같다 — 사람이 `npm run lint`를
# 직접 칠 때만 돌기 때문이다. 규칙을 문서에서 코드로 옮긴 이유가 "리뷰 때마다 같은
# 지적이 반복되지 않게" 하는 것이었으니, 리뷰보다 먼저 돌아야 한다.
name: lint

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall이 pdfjs 자산을 public/으로 복사한다. 건너뛰면 빌드가 아니라
      # 그 스크립트에서 먼저 깨지므로 기본 설치를 그대로 쓴다.
      - run: npm ci

      - name: eslint
        run: npm run lint

      - name: 타입체크
        run: npx tsc --noEmit
